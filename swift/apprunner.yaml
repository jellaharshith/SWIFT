version: 1.0
runtime: PYTHON_3
build:
  commands:
    pre-build:
      - pip install --upgrade pip
    build:
      - pip install -r requirement.txt
    post-build: []
  env:
    - name: PYTHONPATH
      value: /app
run:
  command: python main.py --help
  network:
    port: 8000
    env: PORT
  env:
    - name: SWIFT_LOG_LEVEL
      value: INFO
    - name: SWIFT_CONFIDENCE_THRESHOLD
      value: "0.95"
    - name: PYTHONPATH
      value: /app
