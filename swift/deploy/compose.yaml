# SWIFT v8 optional lab stack.
#
# Brings up the services Decepticon assumes (LiteLLM router, Neo4j attack
# graph, sandbox-daemon for in-container Kali execution) so SWIFT's
# LangGraph specialists can route multi-provider LLM calls + persist the
# attack graph + drive interactive tmux sessions inside an isolated
# network.
#
# Default install of swiftsec does NOT need this; it is opt-in via
# `swiftsec lab up`. When down, the SWIFT CLI silently falls back to
# direct Anthropic SDK + SQLite knowledge graph + plain subprocess.
#
# Service ports are kept on localhost only.
version: "3.9"

networks:
  swift-mgmt:
    driver: bridge
  swift-sandbox:
    driver: bridge
    internal: false   # set true to fully isolate sandbox from internet

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: swift-litellm
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-local}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:4000:4000"
    networks: [swift-mgmt]
    restart: unless-stopped

  neo4j:
    image: neo4j:5.20
    container_name: swift-neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/swiftsec-local}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - swift-neo4j-data:/data
    networks: [swift-mgmt]
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: swift-postgres
    environment:
      - POSTGRES_USER=swift
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-swiftsec-local}
      - POSTGRES_DB=swift
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - swift-postgres-data:/var/lib/postgresql/data
    networks: [swift-mgmt]
    restart: unless-stopped

  sandbox-daemon:
    # Kali base image bundles the tool surface SWIFT's LangGraph specialists
    # expect (nmap, sqlmap, nuclei, msfconsole, sliver-client, etc.).
    build:
      context: ./kali
      dockerfile: Dockerfile
    container_name: swift-sandbox
    networks: [swift-sandbox]
    cap_add:
      - NET_RAW          # nmap raw sockets
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m
    restart: unless-stopped
    # No exposed ports -- daemon is invoked via `docker exec` from the host.

volumes:
  swift-neo4j-data: {}
  swift-postgres-data: {}
