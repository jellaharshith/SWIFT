[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftsec"
version = "8.0.0"
description = "SWIFT — unified AI red-team platform: OWASP + Kali + LangGraph multi-agent + bug-bounty automation behind one ROE."
readme = { text = "SWIFT (swiftsec) v8 — red-team automation, OSINT, Kali tooling, Playwright probes, LangGraph multi-agent (Decepticon fork), and bug-bounty hunt automation (claude-bug-bounty fork). Full docs: https://github.com/jellaharshith/SWIFT", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "SWIFT Maintainers" }]
keywords = ["security", "vulnerability-scanner", "sast", "ai", "anthropic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "anthropic>=0.7.0",
  "httpx[http2]>=0.24.0",
  "rich",
  "python-dotenv>=0.21.0",
  "pydantic>=2.0",
  "click>=8.0.0",
  "requests>=2.31.0",
  "reportlab>=4.0.0",
  "pyyaml>=6.0",
  "websockets>=12.0",
  "cryptography>=41.0",
  "jsonschema>=4.0",
  "diskcache>=5.6",
]

[project.optional-dependencies]
intel = [
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0",
  "feedparser>=6.0.11",
  "gitpython>=3.1",
  "aiofiles>=23.0",
  "schedule>=1.2",
  "tiktoken>=0.7",
  "openai>=1.30",
  "google-generativeai>=0.8",
  "pyhibp>=4.0",
]
kali    = ["pymetasploit3>=1.0", "python-gvm>=24.0"]
sandbox = ["docker>=6.0.0"]
web     = ["playwright>=1.47.0"]
server  = [
  "fastapi>=0.100.0", "uvicorn>=0.23.0",
  "sqlalchemy>=2.0.0", "alembic>=1.13.0",
  "psycopg2-binary>=2.9.0", "python-multipart>=0.0.6", "jinja2>=3.1.0",
]
oob     = ["dnslib>=0.9"]
ctf     = ["swiftsec[web,oob]"]
# v8.0 additions
langgraph = [
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-anthropic>=0.2.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
]
litellm = ["litellm>=1.40.0"]
graph   = ["networkx>=3.0"]
graph-neo4j = ["neo4j>=5.0"]
tmux    = ["libtmux>=0.30"]
web3    = ["slither-analyzer>=0.10", "mythril>=0.24", "web3>=6.0"]
bounty  = []  # external Go/Rust tools installed via swift/skills/README.md, not pip
all = ["swiftsec[sandbox,web,server,oob,intel,kali,langgraph,litellm,graph,tmux,web3]"]
dev = [
  "pytest>=7.0.0", "pytest-cov>=4.0.0", "pytest-mock>=3.10.0", "pytest-asyncio>=0.23.0",
  "black>=23.0.0", "flake8>=6.0.0", "isort>=5.12.0",
  "ruff>=0.5.0", "mypy>=1.10.0", "pre-commit>=3.7.0",
  "build>=1.0.0", "cairosvg>=2.7.0", "Pillow>=10.0.0", "pyfiglet>=1.0.0",
  "psutil>=5.9.0",
]

[project.scripts]
swiftsec = "swift_cli:main"

[project.entry-points."swift.modules"]
ssrf      = "swift.sdk.migration:SSRFAdapter"
sqli      = "swift.sdk.migration:SQLIAdapter"
xss       = "swift.sdk.migration:XSSAdapter"
idor      = "swift.sdk.migration:IDORAdapter"
jwt       = "swift.sdk.migration:JWTAdapter"
graphql   = "swift.sdk.migration:GraphQLAdapter"
oob_ssrf         = "swift.probes.oob_ssrf:OOBSSRFProbe"
oauth            = "swift.probes.oauth:OAuthProbe"
websocket        = "swift.probes.websocket:WebSocketProbe"
bizlogic         = "swift.probes.bizlogic:BusinessLogicProbe"
cloud_aws        = "probes.cloud_aws:AWSMetadataSSRFProbe"
supply_chain     = "probes.supply_chain:SupplyChainProbe"
credential_check = "probes.credential_check:CredentialCheckProbe"
mobile_static    = "probes.mobile_static:MobileStaticProbe"
active_directory = "probes.active_directory:ActiveDirectoryProbe"
network_service  = "probes.network_service:NetworkServiceExploitProbe"

[project.urls]
Homepage   = "https://github.com/jellaharshith/SWIFT"
Repository = "https://github.com/jellaharshith/SWIFT"
Issues     = "https://github.com/jellaharshith/SWIFT/issues"

[tool.setuptools]
py-modules = [
  "swift_cli",
  "validation_schema",
  "generate_pdf_report",
  "generate_evidence_manifest",
]
packages = [
  "agent", "analysis", "audit", "browser", "chains", "cli", "config", "feeds",
  "kali", "log", "osint", "output", "post_exploit", "sandbox", "scanners",
  "security", "server", "tools", "triage", "utils",
  "swift", "assets", "assets.logo",
  "intel", "intel.sources", "intel.store", "intel.query", "intel.sync",
  "probes",
  # v8.0 additions
  "graph", "llm", "bounty", "bounty.web3", "engagement",
  "agent.langgraph_layer",
  "agent.langgraph_layer.graphs",
  "agent.langgraph_layer.agents",
  "agent.langgraph_layer.tools",
  "agent.langgraph_layer.middleware",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.txt", "*.md"]
"assets.logo" = ["*.txt", "*.svg", "*.png", "*.ico", "*.md", "*.sh"]
"kali" = ["Dockerfile"]

[tool.setuptools.data-files]
"share/swiftsec/deploy" = ["deploy/compose.yaml"]
"share/swiftsec/deploy/kali" = ["deploy/kali/Dockerfile"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["S101", "S603", "S607", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["S", "B", "E"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "test.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "unit: fast unit tests",
  "integration: integration tests (require API key)",
  "e2e: end-to-end tests (SWIFT_RUN_E2E=1)",
  "slow: slow tests",
]

[tool.coverage.run]
branch = true
omit = ["test/*", "*/tests/*", "build/*", "assets/*", "setup.py"]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 45
