[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftsec"
version = "2.0.0"
description = "SWIFT — AI-powered continuous vulnerability scanner and patch generator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SWIFT Maintainers" }]
keywords = ["security", "vulnerability-scanner", "sast", "ai", "anthropic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "anthropic>=0.7.0",
  "httpx[http2]>=0.24.0",
  "rich",
  "python-dotenv>=0.21.0",
  "pydantic>=2.0",
  "click>=8.0.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
sandbox = ["docker>=6.0.0"]
web     = ["playwright>=1.47.0"]
server  = [
  "fastapi>=0.100.0", "uvicorn>=0.23.0",
  "sqlalchemy>=2.0.0", "alembic>=1.13.0",
  "psycopg2-binary>=2.9.0", "python-multipart>=0.0.6", "jinja2>=3.1.0",
]
all = ["swiftsec[sandbox,web,server]"]
dev = [
  "pytest>=7.0.0", "pytest-cov>=4.0.0", "pytest-mock>=3.10.0",
  "black>=23.0.0", "flake8>=6.0.0", "isort>=5.12.0",
  "ruff>=0.5.0", "mypy>=1.10.0", "pre-commit>=3.7.0",
  "build>=1.0.0", "cairosvg>=2.7.0", "Pillow>=10.0.0", "pyfiglet>=1.0.0",
]

[project.scripts]
swiftsec = "swift_cli:main"

[project.urls]
Homepage   = "https://github.com/jellaharshith/SWIFT"
Repository = "https://github.com/jellaharshith/SWIFT"
Issues     = "https://github.com/jellaharshith/SWIFT/issues"

[tool.setuptools]
py-modules = [
  "swift_cli",
  "patch_validator",
  "patch_apply",
  "sandbox_runner",
  "validation_schema",
  "generate_pdf_report",
  "generate_evidence_manifest",
]
packages = [
  "agent", "analysis", "browser", "chains", "cli", "config", "feeds",
  "kali", "log", "output", "patches", "sandbox", "scanners", "security",
  "server", "tools", "triage", "utils",
  "swift", "assets", "assets.logo",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.txt", "*.md"]
"assets.logo" = ["*.txt", "*.svg", "*.png", "*.ico", "*.md", "*.sh"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["S101", "S603", "S607", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["S", "B", "E"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "test.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra --strict-markers"
markers = [
  "unit: fast unit tests",
  "integration: integration tests (require API key)",
  "e2e: end-to-end tests (SWIFT_RUN_E2E=1)",
  "slow: slow tests",
]

[tool.coverage.run]
branch = true
omit = ["test/*", "*/tests/*", "build/*", "assets/*", "setup.py"]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 50
