name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af68  # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true

      - name: Format check (ruff)
        run: ruff format --check .
        continue-on-error: true

      - name: Type check (mypy)
        run: mypy swift_cli.py cli config log --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: pytest -m "not slow and not e2e and not integration" --cov=. --cov-report=xml --cov-report=term-missing
        env:
          SWIFT_NO_BANNER: "1"

      - name: Upload coverage
        uses: codecov/codecov-action@0565240a2034fe40724a3765de43b03b717cd3f  # v4.5.0
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
