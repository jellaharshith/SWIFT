<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hexagonal shield -->
  <polygon
    points="128,30 215,78 215,178 128,226 41,178 41,78"
    fill="none"
    stroke="#0EA5E9"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- Arrow chevron pointing right (filled with gradient) -->
  <polygon
    points="62,82 148,128 62,174 82,174 168,128 82,82"
    fill="url(#grad)"
  />

  <!-- AI dot at arrow tip -->
  <circle cx="168" cy="128" r="9" fill="#22D3EE" />
</svg>
