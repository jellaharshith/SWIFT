name: Deploy to AWS AppRunner

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: swift-scanner
  APPRUNNER_SERVICE_NAME: swift-scanner

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::104363824413:role/github-actions-swift-deploy
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Store ANTHROPIC_API_KEY in Secrets Manager
        if: secrets.ANTHROPIC_API_KEY != ''
        run: |
          aws secretsmanager create-secret \
            --name swift/anthropic-api-key \
            --secret-string "${{ secrets.ANTHROPIC_API_KEY }}" \
            --region us-east-2 2>/dev/null || \
          aws secretsmanager update-secret \
            --secret-id swift/anthropic-api-key \
            --secret-string "${{ secrets.ANTHROPIC_API_KEY }}" \
            --region us-east-2

      - name: Deploy to App Runner
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Get existing service ARN if it exists
          SERVICE_ARN=$(aws apprunner list-services --region us-east-2 --query "ServiceSummaryList[?ServiceName=='swift-scanner'].ServiceArn" --output text 2>/dev/null || echo "")

          # Build source config with secret if available
          SECRET_ARN=$(aws secretsmanager describe-secret --secret-id swift/anthropic-api-key --region us-east-2 --query ARN --output text 2>/dev/null || echo "")

          if [ -n "$SECRET_ARN" ]; then
            SOURCE_CONFIG="ImageRepository={ImageIdentifier=${ECR_REGISTRY}/swift-scanner:${IMAGE_TAG},ImageRepositoryType=ECR,ImageConfiguration={Port=8000,RuntimeEnvironmentVariables={SWIFT_LOG_LEVEL=INFO,SWIFT_CONFIDENCE_THRESHOLD=0.95,PYTHONPATH=/app,SWIFT_ENV=apprunner},RuntimeEnvironmentSecrets={ANTHROPIC_API_KEY=${SECRET_ARN}}}}"
          else
            SOURCE_CONFIG="ImageRepository={ImageIdentifier=${ECR_REGISTRY}/swift-scanner:${IMAGE_TAG},ImageRepositoryType=ECR,ImageConfiguration={Port=8000,RuntimeEnvironmentVariables={SWIFT_LOG_LEVEL=INFO,SWIFT_CONFIDENCE_THRESHOLD=0.95,PYTHONPATH=/app,SWIFT_ENV=apprunner}}}"
          fi

          # Update or create service
          if [ -n "$SERVICE_ARN" ]; then
            echo "Updating existing service: $SERVICE_ARN"
            aws apprunner update-service \
              --service-arn "$SERVICE_ARN" \
              --source-configuration "$SOURCE_CONFIG" \
              --region us-east-2
          else
            echo "Creating new service"
            aws apprunner create-service \
              --service-name swift-scanner \
              --source-configuration "$SOURCE_CONFIG" \
              --instance-configuration "Cpu=1 vCPU,Memory=2 GB" \
              --region us-east-2
          fi
